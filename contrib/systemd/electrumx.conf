# default /etc/electrumx.conf for systemd (plm-electrumx, Palladium)

# REQUIRED
DB_DIRECTORY = /db
# leveldb or rocksdb (the matching pip extra must be installed)
DB_ENGINE = rocksdb
# Palladium node RPC credentials (the node needs server=1 and txindex=1)
DAEMON_URL = http://username:password@127.0.0.1:2332/
# without SERVICES the server accepts no connections. rpc:// is needed by electrumx_rpc (used by the service file to stop)
SERVICES = tcp://:50001,rpc://

# Palladium is the default coin; NET can be mainnet (default), testnet or regtest
# COIN = Palladium
# NET = mainnet

# See docs/environment.rst for information about other configuration settings
# you probably want to consider (SSL_CERTFILE/SSL_KEYFILE and ssl:// in SERVICES, REPORT_SERVICES, ...).
